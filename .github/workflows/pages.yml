name: Deploy Insult Counter to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/insult-counter-app-s8ry9l
    paths:
      - "insult-counter/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload app folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./insult-counter

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
