<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1126" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jewels Counter" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Jewels Insult Counter</title>
  <style>
    :root {
      --bg: #1a1126;
      --bg2: #25183a;
      --accent: #ff5d8f;
      --accent2: #b06bff;
      --text: #f3eefc;
      --muted: #a99bc4;
      --good: #4ade80;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      text-align: center;
      padding: 18px 16px 6px;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .stats {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
    }
    .stat {
      flex: 1;
      background: var(--bg2);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }
    .stat .num { font-size: 1.6rem; font-weight: 700; }
    .stat .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }

    .tap-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      gap: 14px;
    }
    .tap-btn {
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, var(--accent2), var(--accent));
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 14px 40px rgba(255, 93, 143, 0.45);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      touch-action: manipulation;
    }
    .tap-btn .count {
      font-size: 5.5rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .tap-btn .hint { font-size: 1rem; opacity: 0.92; margin-top: 6px; font-weight: 600; }
    .tap-btn:active { transform: scale(0.95); box-shadow: 0 6px 18px rgba(255, 93, 143, 0.4); }
    .tap-btn.pop { animation: pop 0.25s ease; }
    @keyframes pop { 0% { transform: scale(1);} 40% { transform: scale(1.06);} 100% { transform: scale(1);} }

    .actions {
      display: flex;
      gap: 10px;
      padding: 0 16px 8px;
    }
    .actions button {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid #3a2b54;
      background: var(--bg2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .actions button:active { background: #31224d; }
    .actions button.danger { color: var(--accent); }

    .log {
      max-height: 26vh;
      overflow-y: auto;
      margin: 0 16px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .log h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin: 6px 0;
    }
    .log .empty { color: var(--muted); font-size: 0.85rem; padding: 6px 0; }
    .log ul { list-style: none; margin: 0; padding: 0; }
    .log li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg2);
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .log li .time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .log li .idx { color: var(--accent); font-weight: 700; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 16px);
      transform: translateX(-50%) translateY(20px);
      background: var(--good);
      color: #06280f;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>💎 Jewels Insult Counter</h1>
    <p>Tap every time your sister roasts you at dinner</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="num" id="tonight">0</div>
      <div class="lbl">Tonight</div>
    </div>
    <div class="stat">
      <div class="num" id="rate">0</div>
      <div class="lbl">Per&nbsp;Hour</div>
    </div>
    <div class="stat">
      <div class="num" id="record">0</div>
      <div class="lbl">Record</div>
    </div>
  </div>

  <div class="tap-wrap">
    <button class="tap-btn" id="tapBtn" aria-label="Count an insult">
      <span class="count" id="count">0</span>
      <span class="hint">TAP = +1 insult</span>
    </button>
  </div>

  <div class="actions">
    <button id="undoBtn">↩︎ Undo</button>
    <button id="resetBtn" class="danger">Reset Night</button>
  </div>

  <div class="log">
    <h2>Timeline</h2>
    <div class="empty" id="emptyLog">No insults logged yet. Lucky you. 🍀</div>
    <ul id="logList"></ul>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
